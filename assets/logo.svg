<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background subtle warmth -->
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fffaf0" stop-opacity="0"/>
    </radialGradient>

    <!-- Green Sprout Gradients -->
    <linearGradient id="mainLeafGrad" x1="20%" y1="90%" x2="80%" y2="10%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="secLeafGrad" x1="10%" y1="70%" x2="70%" y2="20%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Tech Circuit Gradients -->
    <linearGradient id="techArcGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>

    <linearGradient id="techArcGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="centerSunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <filter id="clayShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1.5" dy="3" stdDeviation="2.5" flood-color="#0b192c" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Circular Outer Tech Tracks -->
  <g filter="url(#clayShadow)">
    <!-- Outer Track 1 -->
    <path d="M 82 50 A 34 34 0 0 1 50 84 A 34 34 0 0 1 20 66" stroke="#059669" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.85"/>
    <!-- Outer Track 2 (Amber) -->
    <path d="M 50 16 A 34 34 0 0 1 84 46" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Track Nodes -->
    <circle cx="84" cy="46" r="3.5" fill="#f59e0b"/>
    <circle cx="20" cy="66" r="3.5" fill="#10b981"/>
    <circle cx="50" cy="84" r="3.5" fill="#047857"/>

    <!-- Inner Tech Circuit Arc -->
    <path d="M 72 40 A 24 24 0 0 1 68 68" stroke="#10b981" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <circle cx="72" cy="40" r="3" fill="#34d399"/>
    <circle cx="68" cy="68" r="3" fill="#059669"/>
  </g>

  <!-- Glowing Central Innovation Hub Orb -->
  <circle cx="54" cy="50" r="16" fill="url(#hubGlow)"/>
  <circle cx="54" cy="50" r="12" fill="url(#centerSunGrad)" filter="url(#clayShadow)"/>
  
  <!-- Circuit Connectors Radiating from Hub -->
  <line x1="54" y1="38" x2="54" y2="34" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="64" y1="44" x2="68" y2="42" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="64" y1="56" x2="68" y2="58" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="54" y1="62" x2="54" y2="66" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Innovation Center Spark -->
  <circle cx="54" cy="50" r="4.5" fill="#ffffff" opacity="0.95"/>

  <!-- Organic Sprout Stem & Main Leaf (Rising gracefully) -->
  <g filter="url(#clayShadow)">
    <!-- Sweeping Root Stem -->
    <path d="M 40 82 C 34 76, 28 64, 30 52 C 32 40, 42 30, 52 18 C 50 32, 42 46, 40 60 C 38 68, 38 76, 40 82 Z" fill="url(#secLeafGrad)"/>
    
    <!-- Primary Top Sprout Leaf -->
    <path d="M 52 18 C 66 18, 72 32, 60 44 C 52 46, 42 40, 52 18 Z" fill="url(#mainLeafGrad)"/>
    <!-- Leaf Vein Detail -->
    <path d="M 52 18 C 56 28, 58 36, 60 44" stroke="#a7f3d0" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.8"/>

    <!-- Secondary Accent Leaf -->
    <path d="M 30 48 C 16 46, 18 34, 32 32 C 36 38, 36 44, 30 48 Z" fill="url(#mainLeafGrad)"/>
    <!-- Secondary Leaf Vein -->
    <path d="M 32 32 C 30 38, 28 42, 30 48" stroke="#a7f3d0" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>
</svg>
